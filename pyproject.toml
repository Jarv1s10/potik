[project]
name = "potik"
version = "0.2.0"
description = "An async Python framework for exactly-once Kafka services."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Danylo Kielsa", email = "danylo.kielsa@gmail.com" }
]
requires-python = ">=3.12"
keywords = ["kafka", "exactly-once", "transactions", "stream-processing", "asyncio", "anyio", "confluent-kafka"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AnyIO",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Distributed Computing",
    "Typing :: Typed",
]
dependencies = [
    "anyio>=4.14.0",
    "confluent-kafka>=2.16.0",
    "typing-extensions>=4.14.0",  # Sentinel, TypeForm, and type parameter defaults before Python 3.13
]

[project.urls]
Homepage = "https://jarv1s10.github.io/potik/"
Documentation = "https://jarv1s10.github.io/potik/"
Repository = "https://github.com/Jarv1s10/potik"
Issues = "https://github.com/Jarv1s10/potik/issues"
Changelog = "https://github.com/Jarv1s10/potik/blob/main/CHANGELOG.md"

[project.optional-dependencies]
otel = [
    "opentelemetry-api>=1.30.0",
    "opentelemetry-semantic-conventions>=0.51b0",
]
pydantic = [
    "pydantic>=2.10.0",
]
msgspec = [
    "msgspec>=0.19.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The nested ruff configs enforce the layering (ADR 0006), and only the source tree needs them.
exclude = ["src/potik/**/ruff.toml"]

[tool.hatch.build.targets.sdist]
# What builds and tests the package. Untracked files, e.g. the docs build cache, stay out.
include = ["/src", "/tests", "/tools", "/examples", "/README.md", "/CHANGELOG.md", "/LICENSE"]


[tool.ruff]
target-version = "py312"
line-length = 120
exclude = [
    ".venv",
    "build",
    "dist",
    "__pycache__",
]

[tool.ruff.lint]
extend-select = [
    "I",  # isort rules
    "C4",  # flake8-comprehensions
    "SIM",  # flake8-simplifications
    "TID251",  # banned imports, which keep each layer from importing the ones above it
    "W291",  # trailing whitespace
    "W293",  # blank line contains whitespace
]
ignore = [
    "E501",  # line length
]

[tool.ruff.format]
exclude = ["docs/**"]

[tool.ty.src]
include = ["src", "examples", "tests/typing"]
exclude = ["benchmarks"]

[tool.ty.rules]
# tests/typing marks each call that type checkers must reject with an ignore comment per checker.
unused-ignore-comment = "error"

[tool.mypy]
files = ["src", "tests/typing"]
warn_unused_ignores = true

[tool.pyrefly]
project-includes = ["src", "tests/typing"]
# Only pyrefly's own ignore comments, because tests/typing has one per checker.
enabled-ignores = ["pyrefly"]

[tool.pyrefly.errors]
unused-ignore = "error"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools"]
# Slow scenarios run with -m slow, everything with -m "".
addopts = ["-ra", "-m", "not slow"]
markers = ["slow: chaos, broker outage, static membership, and example scenarios, each taking up to a minute"]
timeout = 300

[dependency-groups]
dev = [
    "msgspec>=0.19.0",
    "mypy>=2.4.1",
    "opentelemetry-exporter-otlp-proto-http>=1.30.0",
    "opentelemetry-sdk>=1.30.0",
    "pydantic>=2.10.0",
    "pyrefly>=1.4.0",
    "pytest>=9.1.1",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
    "starlette>=1.10.0",
    "testcontainers>=4.15.0",
    "uvicorn>=0.54.0",
]
docs = [
    "mkdocstrings-python>=2.0.10",
    "zensical>=0.0.71",
]
