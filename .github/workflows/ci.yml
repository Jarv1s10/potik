name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * *"  # the slow scenarios, nightly
  workflow_dispatch:
    inputs:
      slow:
        description: Run the slow scenarios too
        type: boolean
        default: false
  workflow_call:
    inputs:
      slow:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uvx prek run --all-files --show-diff-on-failure
      - run: uv run --no-dev --group docs zensical build --strict

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python }}
      PYTHONFAULTHANDLER: "1"  # a crashed worker prints its traceback
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: docker pull apache/kafka:4.1.0  # once, not in every worker at once
      - run: uv run pytest -n 4

  debug-crash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: docker pull apache/kafka:4.1.0
      - run: sudo apt-get install -y -qq strace > /dev/null
      - run: uv sync -q
      - run: |
          for i in 1 2 3 4; do
            strace -f -qq -e trace=kill,tkill,tgkill,exit_group,exit -e signal=none -o /tmp/st$i.txt .venv/bin/pytest -n 4 -q 2>&1 | grep -E "crashed while|passed|failed" | tail -3
            if ! grep -q "passed in" <(tail -0 /tmp/st$i.txt); then :; fi
            echo "== kills in run $i"; grep -E "kill\(" /tmp/st$i.txt | grep -v "= -1 ESRCH" | head -30
            echo "== nonzero exits in run $i"; grep -E "exit_group\([^0]" /tmp/st$i.txt | head -20
          done

  # The oldest versions that pyproject.toml allows, so its lower bounds stay true.
  lowest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv lock --resolution lowest-direct
      - run: uv sync --frozen --all-extras
      - run: uv run --frozen pytest tests/unit -n 4

  slow:
    if: github.event_name == 'schedule' || inputs.slow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: docker pull apache/kafka:4.1.0
      - run: uv run pytest -m slow -n 4
