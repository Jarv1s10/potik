name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * *"  # the slow scenarios, nightly
  workflow_dispatch:
    inputs:
      slow:
        description: Run the slow scenarios too
        type: boolean
        default: false
  workflow_call:
    inputs:
      slow:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uvx prek run --all-files --show-diff-on-failure
      - run: uv run --no-dev --group docs zensical build --strict

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python }}
      PYTHONFAULTHANDLER: "1"  # a crashed worker prints its traceback
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: docker pull apache/kafka:4.1.0  # once, not in every worker at once
      - run: uv run pytest -n 4

  debug-crash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: docker pull apache/kafka:4.1.0
      - run: |
          mkdir -p /tmp/dbg && cat > /tmp/dbg/debugsig.py <<'PY'
          import faulthandler, os, signal, sys
          SIGS = [signal.SIGTERM, signal.SIGPIPE, signal.SIGALRM, signal.SIGHUP, signal.SIGUSR1, signal.SIGUSR2, signal.SIGINT]
          def pytest_runtest_setup(item):
              disp = {s.name: str(signal.getsignal(s))[:40] for s in SIGS}
              print(f"\n[{os.getpid()}] SETUP {item.nodeid} {disp}", file=sys.stderr, flush=True)
              for s in (signal.SIGTERM, signal.SIGPIPE, signal.SIGALRM, signal.SIGHUP, signal.SIGUSR1, signal.SIGUSR2):
                  if signal.getsignal(s) in (signal.SIG_DFL, None):
                      faulthandler.register(s, all_threads=True, chain=False)
          PY
          for i in 1 2 3; do PYTHONPATH=/tmp/dbg uv run pytest -p debugsig -n 4 -q 2>/tmp/dbg/err$i.txt | grep -E "crashed while|passed|failed" | tail -3; done
          for i in 1 2 3; do echo "== run $i"; grep -B3 -A25 -E "^(Current thread|Thread 0x|Fatal)" /tmp/dbg/err$i.txt | head -80; done
          echo "== dispositions that changed"; cat /tmp/dbg/err*.txt | grep SETUP | grep -oE "\{.*\}" | sort | uniq -c

  # The oldest versions that pyproject.toml allows, so its lower bounds stay true.
  lowest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv lock --resolution lowest-direct
      - run: uv sync --frozen --all-extras
      - run: uv run --frozen pytest tests/unit -n 4

  slow:
    if: github.event_name == 'schedule' || inputs.slow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: docker pull apache/kafka:4.1.0
      - run: uv run pytest -m slow -n 4
