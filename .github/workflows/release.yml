name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      slow: true

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: false
      - run: test "v$(uv version --short)" = "$GITHUB_REF_NAME"  # the tag names the version that gets published
      - run: uv build
      - run: uv run --isolated --no-project --with dist/*.whl python -c "import potik.core, potik.middleware, potik.testing"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: [ci, build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/potik/
    permissions:
      id-token: write  # trusted publishing and attestations
    steps:
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: false
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: astral-sh/attest-action@v0.0.7
      - run: uv publish

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --notes "See [CHANGELOG.md](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/CHANGELOG.md)." dist/*.whl dist/*.tar.gz
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

  docs:
    needs: publish
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yml
