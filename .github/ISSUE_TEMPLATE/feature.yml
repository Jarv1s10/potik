name: Feature request
description: Something potik should do that it doesn't.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Check [what potik doesn't do](https://jarv1s10.github.io/potik/#not-supported-yet) first. It lists the planned features and the ones left out on purpose.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you're trying to do, and why potik makes it hard today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How you'd like it to work. An API sketch helps.
